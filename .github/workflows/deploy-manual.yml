name: Manual Mobile API Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable ECR image tag to deploy, for example sha-<commit SHA>
        required: true
        type: string
      confirm:
        description: Type deploy to confirm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: mobile-api-production
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy selected immutable image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
          IMAGE_URI: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:${{ inputs.image_tag }}
          HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL }}
          HEALTH_CHECK_PATH: /hello
        run: bash scripts/deploy-ecs.sh

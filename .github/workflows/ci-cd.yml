name: Mobile API CI and Production Deploy

on:
  pull_request:
    branches: [Main]
  push:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mobile-api-production
  cancel-in-progress: false

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Tests/PropsSeekr-MobileAPI.Tests/PropsSeekr-MobileAPI.Tests.csproj

      - name: Build
        run: dotnet build PropSeekr.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test Tests/PropsSeekr-MobileAPI.Tests/PropsSeekr-MobileAPI.Tests.csproj --configuration Release --no-restore --verbosity normal

  build_and_push:
    name: Build immutable image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and push image
        id: image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: bash scripts/build-and-push-image.sh

  deploy:
    name: Deploy production
    needs: build_and_push
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check deployment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
          HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL }}
        run: |
          set -euo pipefail

          echo "AWS_REGION=${AWS_REGION}"
          echo "AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}"
          echo "ECS_CLUSTER=${ECS_CLUSTER}"
          echo "ECS_SERVICE=${ECS_SERVICE}"
          echo "ECS_CONTAINER_NAME=${ECS_CONTAINER_NAME}"
          echo "HEALTH_CHECK_URL=${HEALTH_CHECK_URL}"

          test -n "${AWS_REGION}" || {
            echo "ERROR: AWS_REGION is missing"
            exit 1
          }

          test -n "${AWS_ACCOUNT_ID}" || {
            echo "ERROR: AWS_ACCOUNT_ID is missing"
            exit 1
          }

          test -n "${ECS_CLUSTER}" || {
            echo "ERROR: ECS_CLUSTER is missing"
            exit 1
          }

          test -n "${ECS_SERVICE}" || {
            echo "ERROR: ECS_SERVICE is missing"
            exit 1
          }

          test -n "${ECS_CONTAINER_NAME}" || {
            echo "ERROR: ECS_CONTAINER_NAME is missing"
            exit 1
          }

          echo "Deployment variables are valid."

      - name: Deploy and verify
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
          IMAGE_URI: ${{ needs.build_and_push.outputs.image_uri }}
          HEALTH_CHECK_URL: ${{ vars.HEALTH_CHECK_URL }}
          HEALTH_CHECK_PATH: /hello
          AWS_SECRETS_MANAGER_CONFIG_NAME: ${{ vars.AWS_SECRETS_MANAGER_CONFIG_NAME || 'dev_test' }}
        run: bash scripts/deploy-ecs.sh
